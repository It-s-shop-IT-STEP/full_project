{% extends 'header.html' %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock %}

{% block content %}
<div class="checkout-page">
    <div class="checkout-container">
        <div class="cart-left-main">
            <h2 id="cart-plural-title">У кошику 0 товарів</h2>
            <div id="cart-items-wrapper"></div>
        </div>

        <aside class="cart-right-summary">
            <div class="summary-card-fixed">
                <div class="summary-line">
                    <span>Сума замовлення:</span>
                    <span id="subtotal-val">0 грн</span>
                </div>
                <div class="summary-line">
                    <span>Знижка:</span>
                    <span>0 грн</span>
                </div>
                <div class="summary-total-big">
                    <span>Разом:</span>
                    <span id="final-total-val">0 грн</span>
                </div>
                <button class="btn-checkout-primary" onclick="location.href='/order/'">Оформити замовлення</button>
                <div style="text-align: center; margin-top: 15px;">
                    <a href="{% url 'catalog' %}" class="link-back-shopping">Продовжити покупки</a>
                </div>
            </div>
        </aside>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/checkout.js' %}"></script>
{% endblock %}
