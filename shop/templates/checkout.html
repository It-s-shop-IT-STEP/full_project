{% extends 'header.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock %}

{% block content %}
<div class="checkout-container">
    <div class="checkout-content">
        <div class="checkout-items-section">
            <h1 id="checkout-count-title">У КОШИКУ 0 ТОВАРИ</h1>
            <div id="checkout-items-list">
                </div>
        </div>

        <div class="checkout-summary-card">
            <div class="summary-details">
                <div class="summary-line">
                    <span>Сума замовлення:</span>
                    <span id="subtotal-price">0$</span>
                </div>
                <div class="summary-line">
                    <span>Знижка:</span>
                    <span>0$</span>
                </div>
                <hr>
                <div class="summary-total">
                    <span>Разом:</span>
                    <span id="total-price">0$</span>
                </div>
            </div>
            
            <a href="{% url 'order_page' %}" class="btn-confirm-order">
                ОФОРМИТИ ЗАМОВЛЕННЯ
            </a>

            <a href="{% url 'catalog' %}" class="btn-continue-shopping">
                Продовжити покупки
            </a>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const checkoutList = document.getElementById('checkout-items-list');
        const cart = JSON.parse(localStorage.getItem('it_shop_cart')) || [];
        const countTitle = document.getElementById('checkout-count-title');

        countTitle.innerText = `У КОШИКУ ${cart.length} ТОВАРИ`;

        if (cart.length === 0) {
            checkoutList.innerHTML = '<p class="empty-msg">Кошик порожній</p>';
            return;
        }

        let total = 0;
        checkoutList.innerHTML = cart.map(item => {
            const itemSum = item.price * (item.quantity || 1);
            total += itemSum;
            return `
                <div class="checkout-item-row">
                    <div class="checkout-item-img">
                        <img src="${item.image}" alt="${item.name}">
                    </div>
                    <div class="checkout-item-info">
                        <h3>${item.name}</h3>
                        <p>Колір: <span>${item.color || 'Не обрано'}</span></p>
                        <p>Розмір: <span>${item.size || 'Не обрано'}</span></p>
                        <div class="item-price-row">
                            <span class="price-blue">${item.price}$</span>
                        </div>
                    </div>
                    <div class="checkout-item-qty">
                        <div class="qty-box">${item.quantity || 1}</div>
                    </div>
                    <button class="btn-remove-checkout" onclick="removeFromCart('${item.id}'); location.reload();">
                        Видалити 🗑️
                    </button>
                </div>
            `;
        }).join('');

        document.getElementById('subtotal-price').innerText = total + '$';
        document.getElementById('total-price').innerText = total + '$';
    });
</script>
{% endblock %}
