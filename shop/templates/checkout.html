{% extends 'header.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/checkout.css' %}">
{% endblock %}

{% block content %}
<div class="checkout-container">
    <div class="checkout-content">
        <div class="checkout-items-section">
            <h1 id="checkout-count-title">У КОШИКУ 0 ТОВАРИ</h1>
            <div id="checkout-items-list">
                </div>
        </div>

        <div class="checkout-summary-card">
            <div class="summary-details">
                <div class="summary-line">
                    <span>Сума замовлення:</span>
                    <span id="subtotal-price">0 грн</span>
                </div>
                <div class="summary-line">
                    <span>Знижка:</span>
                    <span>0 грн</span>
                </div>
                <hr>
                <div class="summary-total">
                    <span>Разом:</span>
                    <span id="total-price">0 грн</span>
                </div>
            </div>
            
            <a href="{% url 'order_page' %}" class="btn-confirm-order">
                ОФОРМИТИ ЗАМОВЛЕННЯ
            </a>

            <a href="{% url 'catalog' %}" class="btn-continue-shopping">
                Продовжити покупки
            </a>
        </div>
    </div>
</div>
