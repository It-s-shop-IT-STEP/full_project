
{% load static %}
<link rel="stylesheet" href="{% static 'css/modals.css' %}">

<div id="fav-modal" class="cart-modal">
    <div class="cart-content">
        <span class="close-fav">&times;</span>
        <h2>УЛЮБЛЕНЕ</h2>
        <div id="fav-items-list"></div>
        <a href="/catalog/">
            <button id="close-fav-btn" class="order-btn">ПРОДОВЖИТИ ПОКУПКИ</button>
        </a>
    </div>
</div>

<div id="cart-modal" class="cart-modal">
    <div class="cart-content">
        <span class="close-cart">&times;</span>
        <h2>ВАШ КОШИК</h2>
        <div id="cart-items-container"></div>
        <div class="cart-footer">
            <p>Всього: <span id="cart-total-price">0</span> грн</p>
            <button class="order-btn" onclick="sendOrderToTelegram()">ОФОРМИТИ ЗАМОВЛЕННЯ</button>
        </div>
    </div>
</div>

<script src="{% static 'js/main.js' %}"></script>
